name: PaperVault CI/CD

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

jobs:
    integration-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Backend Dependencies
              working-directory: ./backend
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Check Code Formatting (Ruff / Flake8)
              working-directory: ./backend
              run: |
                  # This proves you care about clean, standardized code
                  pip install flake8
                  flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

            - name: Validate Docker Infrastructure
              # This proves your infrastructure as code is stable
              run: |
                  # Dynamically create the .env file from the example template for the runner
                  cp .env.example .env
                  docker compose config
                  docker compose build
